<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">asszxc / Glass Dawn</title>
  <desc id="desc">A dark typographic banner with translucent geometric panels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#27242e"/><stop offset=".5" stop-color="#171a24"/><stop offset="1" stop-color="#0b111d"/>
    </linearGradient>
    <radialGradient id="dawn" cx=".17" cy="0" r=".83">
      <stop stop-color="#947779" stop-opacity=".55"/><stop offset="1" stop-color="#947779" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e6d8dd" stop-opacity=".18"/><stop offset="1" stop-color="#c6bcc7" stop-opacity=".025"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f6e9ed" stop-opacity=".42"/><stop offset="1" stop-color="#b9d5ff" stop-opacity=".09"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="360" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#dawn)"/>
    <g fill="none" stroke="#d6c9d6" stroke-opacity=".055">
      <path d="M0 90H1200M0 180H1200M0 270H1200M150 0V360M300 0V360M450 0V360M600 0V360M750 0V360M900 0V360M1050 0V360"/>
    </g>
    <g transform="translate(1030 180) rotate(-32)">
      <rect x="-144" y="-213" width="260" height="426" rx="30" fill="url(#glass)" stroke="url(#edge)"/>
      <rect x="-94" y="-167" width="260" height="426" rx="30" fill="url(#glass)" stroke="url(#edge)"/>
      <rect x="-44" y="-121" width="260" height="426" rx="30" fill="url(#glass)" stroke="url(#edge)"/>
    </g>
    <rect x="1" y="1" width="1198" height="358" rx="21" fill="none" stroke="#e6d8dd" stroke-opacity=".17"/>
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="70" y="61" font-size="14" font-weight="700" letter-spacing="5" fill="#e0d2dc">A S S Z X C  /  D I S C O R D</text>
      <text x="64" y="173" font-size="86" font-weight="700" letter-spacing="-4" fill="#f4f0f5">Glass Dawn.</text>
      <text x="70" y="216" font-size="23" fill="#c6bcc7">A quieter desktop. A personal atmosphere.</text>
      <path d="M70 259H660" stroke="#ece2e9" stroke-opacity=".22"/>
      <text x="70" y="301" font-size="14" letter-spacing="3" fill="#ddd1dd">TRANSLUCENT UI  /  BETTERDISCORD  /  1.0.0</text>
    </g>
    <circle cx="1129" cy="50" r="5" fill="#d9c6d4"/><circle cx="1129" cy="50" r="11" fill="none" stroke="#d9c6d4" stroke-opacity=".35"/>
  </g>
